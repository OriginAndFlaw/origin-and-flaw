name: render
on:
  push:
    paths: ["queue/next.txt"]     # "<episode> <upload yes|no> [only]": committing this file starts a render
  repository_dispatch:
    types: [render-episode]      # Make.com sends {"event_type":"render-episode","client_payload":{"episode":"ep01-..."}}
  workflow_dispatch:
    inputs:
      episode:
        description: "episode folder name, e.g. ep01-hyatt-regency"
        required: true
      only:
        description: "long,arabic,dubs,short,extra,thumb"
        default: "long,arabic,dubs,short,extra,thumb"
      upload:
        description: "send to YouTube when done (yes/no)"
        default: "no"
permissions:
  contents: write
concurrency:
  group: render
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      EPISODE: ${{ github.event.client_payload.episode || inputs.episode }}
      ONLY: ${{ github.event.client_payload.only || inputs.only || 'long,arabic,dubs,short,extra,thumb' }}
      UPLOAD: ${{ inputs.upload || 'yes' }}
    steps:
      - uses: actions/checkout@v4
      - name: Read queue/next.txt (push trigger)
        if: ${{ github.event_name == 'push' }}
        run: |
          read ep up only rest < <(tr -d '\r' < queue/next.txt)
          echo "EPISODE=$ep" >> "$GITHUB_ENV"
          echo "UPLOAD=${up:-no}" >> "$GITHUB_ENV"
          if [ -n "$only" ]; then echo "ONLY=$only" >> "$GITHUB_ENV"; fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: System tools (FFmpeg with libass, fonts)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core fonts-noto-core
      - run: pip install -r requirements.txt
      - name: Cache speech model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small
      - name: Render
        env:
          FAL_KEY: ${{ secrets.FAL_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GOOGLE_TTS_KEY_JSON: ${{ secrets.GOOGLE_TTS_KEY_JSON }}
        run: python -m oaf.render --episode "$EPISODE" --only "$ONLY"
      - name: Quality check (a FAIL stops the release, so the video can never be posted)
        if: ${{ contains(env.ONLY, 'long') }}
        run: python -m oaf.qa --episode "$EPISODE"
      - name: Keep the stills and the Fal.ai spend record
        run: |
          git config user.name "oaf-bot"
          git config user.email "oaf-bot@users.noreply.github.com"
          git add "episodes/$EPISODE/images" budget/ || true
          git diff --cached --quiet || git commit -m "stills + budget for $EPISODE"
          git pull --rebase -q && git push || echo "could not save stills"
      - name: Files as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.EPISODE }}
          path: |
            out/${{ env.EPISODE }}/*.mp4
            out/${{ env.EPISODE }}/*.m4a
            out/${{ env.EPISODE }}/*.srt
            out/${{ env.EPISODE }}/*.jpg
            out/${{ env.EPISODE }}/meta.json
          retention-days: 14
      - name: Release (public review links, also used by Make)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # add or replace only the files this run made; files from earlier runs (e.g. the long video) stay
          shopt -s nullglob
          files=(out/$EPISODE/*.mp4 out/$EPISODE/*.jpg out/$EPISODE/*.srt out/$EPISODE/*.m4a out/$EPISODE/chapters*.txt out/$EPISODE/qa*.txt)
          if gh release view "$EPISODE" >/dev/null 2>&1; then
            gh release upload "$EPISODE" "${files[@]}" --clobber
          else
            gh release create "$EPISODE" "${files[@]}" --title "$EPISODE" --notes "rendered by Actions"
          fi
      - name: Upload
        if: ${{ (vars.UPLOAD_MODE == 'api' || vars.UPLOAD_MODE == 'make') && env.UPLOAD != 'no' }}
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
        run: |
          sed -i "s/^  mode: .*/  mode: ${{ vars.UPLOAD_MODE }}/" config.yml
          python -m oaf.upload --episode "$EPISODE" \
            --base-url "https://github.com/${{ github.repository }}/releases/download/$EPISODE/"
